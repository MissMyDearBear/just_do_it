name: just_do_it
description: "An app for helper people do their own task."
publish_to: 'none'

version: 1.0.0+1

environment:
  # 匹配你当前 Flutter 3.24.5 自带的 Dart 3.5.4
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 降级 drift 以兼容 Dart 3.5 并与 drift_dev 匹配
  drift: 2.23.1
  path_provider: 2.1.0
  path: ^1.8.0
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  android_intent_plus: 5.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # build_runner 2.4.13 是最后一个不需要 Dart 3.6+ 的版本
  build_runner: 2.4.13
  # 保持与 drift 版本一致
  drift_dev: 2.23.1
  # flutter_lints 4.0.0 兼容 Dart 3.5 (5.0 需要 Dart 3.7)
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/TaskList.json